<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DIL Render Test</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/github-dark.min.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="markdown.js"></script>
</head>
<body style="padding:20px; max-width:768px; margin:auto;">
  <h1 style="color:var(--text-primary)">DIL Render Test</h1>
  <div id="output" class="msg-assistant"></div>

  <script>
    var testContent = [
      '<row align="center" gap={2}> <icon name="check-circle" color="success" size="lg"/> **Decryption Pipeline** </row>',
      '',
      '<box border radius="lg" padding={3} align="center" gap={1}>',
      '**HTTP Response** <text color="secondary" size="xs">Base64 26,996 characters</text>',
      '<row justify="center"><icon name="arrow-down"/></row>',
      '**Base64 Decode** <text color="secondary" size="xs">20,247 encrypted bytes</text>',
      '<row justify="center"><icon name="arrow-down"/></row>',
      '**PBKDF2-HMAC-SHA256** <text color="secondary" size="xs">Key Material 256-bit</text>',
      '<row justify="center"><icon name="arrow-down"/></row>',
      '**AES-256-GCM Streaming** <text color="secondary" size="xs">5 segments</text>',
      '</box>',
      '',
      '<row align="center" gap={2}> <icon name="check-circle" color="success"/> **Done!** </row>',
      '',
      '<box background="surface" radius="md" padding={3}>',
      '<text color="secondary" size="xs">Decrypted JSON</text>',
      '<text color="secondary" size="xs">20,127 plaintext bytes</text>',
      '</box>',
      '',
      '### Summary',
      '1. PBKDF2 key derivation',
      '2. AES-GCM decrypt 5 segments',
      '',
      '```python',
      'import hashlib',
      'key = hashlib.pbkdf2_hmac("sha256", password, salt, 100000, 32)',
      '```',
    ].join('\n');

    document.getElementById('output').innerHTML = renderMarkdown(testContent);
  </script>
</body>
</html>
